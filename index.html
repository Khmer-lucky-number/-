<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ទម្រង់ដាក់ពាក្យធ្វើការ</title>
    <style>
        body {
            font-family: 'Kantumruy Pro', 'Khmer OS Battambang', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .apply-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="apply-card">
    <h2>ទម្រង់ដាក់ពាក្យធ្វើការ</h2>
    <form action="#" method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="fullname">ឈ្មោះពេញ:</label>
            <input type="text" id="fullname" name="fullname" required placeholder="ឧ. សុខ មករា">
        </div>

        <div class="form-group">
            <label for="email">អ៊ីមែល:</label>
            <input type="email" id="email" name="email" required placeholder="example@mail.com">
        </div>

        <div class="form-group">
            <label for="phone">លេខទូរស័ព្ទ:</label>
            <input type="tel" id="phone" name="phone" required placeholder="012 345 678">
        </div>

        <div class="form-group">
            <label for="position">តំណែងដែលចង់ដាក់:</label>
            <select id="position" name="position">
                <option value="frontend">Frontend Developer</option>
                <option value="backend">Backend Developer</option>
                <option value="designer">UI/UX Designer</option>
                <option value="marketing">Digital Marketing</option>
            </select>
        </div>

        <div class="form-group">
            <label for="resume">តម្លើងប្រវត្តិរូបសង្ខេប (CV / Résumé):</label>
            <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required>
        </div>

        <div class="form-group">
            <label for="message">សារបន្ថែម (បើមាន):</label>
            <textarea id="message" name="message" rows="4"></textarea>
        </div>

        <button type="submit">ផ្ញើពាក្យសុំ</button>
    </form>
</div>

</body>
</html>
